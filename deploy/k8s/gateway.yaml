apiVersion: v1
kind: ConfigMap
metadata:
  name: spamguard-gateway
data:
  MODEL_URL: http://spamguard-model:8000
  BATCH_SIZE: "32"
  BATCH_WAIT: 5ms
  MAX_IN_FLIGHT: "4"
  CACHE_SIZE: "10000"
  CACHE_TTL: 10m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spamguard-gateway
  labels:
    app: spamguard-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spamguard-gateway
  template:
    metadata:
      labels:
        app: spamguard-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: gateway
          image: ghcr.io/bekonat/spamguard-gateway:latest
          envFrom:
            - configMapRef:
                name: spamguard-gateway
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: spamguard-gateway
spec:
  selector:
    app: spamguard-gateway
  ports:
    - port: 80
      targetPort: 8080
